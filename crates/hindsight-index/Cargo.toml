[package]
name = "hindsight-index"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Indexes Hindsight trace files into an embedded DuckDB database."

[dependencies]
duckdb = { version = "1.1", features = ["bundled"] }
arrow = "53"
hindsight-format = { path = "../hindsight-format" }
thiserror = "2"
toml = "0.8"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
