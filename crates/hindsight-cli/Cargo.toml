[package]
name = "hindsight-cli"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Command-line entry point that orchestrates the Hindsight components."

[[bin]]
name = "hindsight"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
hindsight-format = { path = "../hindsight-format" }
hindsight-index = { path = "../hindsight-index" }
hindsight-mcp = { path = "../hindsight-mcp" }
