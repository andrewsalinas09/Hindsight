[package]
name = "hindsight-mcp"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Model Context Protocol server exposing Hindsight debugging primitives."

[dependencies]
rmcp = { version = "=1.6.0", features = ["server", "macros", "transport-io", "schemars"] }
schemars = "1.0"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "io-std", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
duckdb = { version = "1.1", features = ["bundled"] }
toml = "0.8"
tracing = "0.1"
hindsight-format = { path = "../hindsight-format" }
hindsight-index = { path = "../hindsight-index" }

[dev-dependencies]
tempfile = "3"
