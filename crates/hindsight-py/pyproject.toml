# Distribution name. Was `hindsight-recorder` in session A as a placeholder;
# we're claiming `hindsight` now (the original 2013 PyPI package was abandoned).
[project]
name = "hindsight"
version = "0.1.0"
description = "AI-native debugger built around the Model Context Protocol."
license = { text = "Apache-2.0" }
requires-python = ">=3.12"

[build-system]
requires = ["maturin>=1.4,<2.0"]
build-backend = "maturin"

[tool.maturin]
# Mixed Python/Rust layout. Pure-Python sources live under `python/`; the
# `hindsight` package's user-facing API (the `@record` decorator etc.) is in
# `python/hindsight/__init__.py`. The Rust extension is published as a
# private submodule `hindsight._core` — its leaf must match `[lib].name` in
# `Cargo.toml` and the `#[pymodule]` function name in `src/lib.rs`.
python-source = "python"
module-name = "hindsight._core"
# Enable PyO3's `extension-module` feature for wheel builds so it doesn't try
# to link libpython (the host interpreter provides it). `cargo test` builds
# don't see this feature, so unit tests can still embed Python via PyO3's
# `auto-initialize` dev-dependency feature.
features = ["pyo3/extension-module"]
