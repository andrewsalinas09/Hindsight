[package]
name = "hindsight-py"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "PyO3 bindings exposing the Hindsight Rust core to the Python recorder."

# `name` is the cdylib filename and the leaf segment of the Python import path.
# We're a "mixed" maturin project: the user-facing package is `hindsight`
# (pure Python under `python/hindsight/`) and the Rust extension is published
# as the private submodule `hindsight._core`. The leaf is `_core`, so the
# cdylib must be `_core.{so,pyd}`. Must match the `#[pymodule]` function name
# in `src/lib.rs` and the `[tool.maturin].module-name` setting in
# `pyproject.toml`.
[lib]
name = "_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.23", features = ["abi3-py312"] }
hindsight-format = { path = "../hindsight-format" }

# `extension-module` is enabled by maturin (see `pyproject.toml`) when building
# the wheel — it tells PyO3 not to link libpython, since the host interpreter
# provides it. We deliberately do NOT make it a default feature: `cargo test`
# needs Python linked into the test binary so it can run `Python::with_gil`,
# which is exactly the opposite of `extension-module`.
[features]
extension-module = ["pyo3/extension-module"]

# `auto-initialize` only kicks in for test/example/bench targets, so it doesn't
# affect maturin's wheel build (which uses `[dependencies]` only). It lets the
# test binary call `Python::with_gil` without a manual `prepare_freethreaded_python()`.
[dev-dependencies]
pyo3 = { version = "0.23", features = ["abi3-py312", "auto-initialize"] }
